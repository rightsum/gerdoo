<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Robot Face</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%;
      background: #070503; overflow: hidden; }
    /* Kiosk: no cursor, no text selection, no touch callouts. */
    * { cursor: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* The toolbar owns the bottom strip of the screen in BOTH modes. mpv is
       sized to the screen minus this height (--geometry in
       video-player.service), so a playing video never covers it. Change this
       and you must change that geometry too. */
    /* The panel is 1920x1080 on a FIVE INCH diagonal — about 440 PPI, roughly
       2.75x a normal desktop screen. CSS pixels here are device pixels
       (devicePixelRatio is 1), so anything sized by eye for a laptop comes out
       physically tiny: a 76px control is 4mm across and cannot be hit.
       Everything below is sized in physical terms instead —
       160px is a little over 9mm, about an Android 48dp touch target. */
    #face { position: fixed; inset: 0; }
    robot-face { position: absolute; inset: 0; }
    @keyframes voicePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    body.pulse robot-face { animation: voicePulse 1.4s ease-in-out infinite; }
    /* Caption for the voice session. The face carries the mood; this says in
       words what the robot is doing, which matters most for "thinking" —
       a colour alone does not distinguish it from waiting. */
    #voice-caption {
      position: fixed; left: 0; right: 0; bottom: 30vh;
      text-align: center; pointer-events: none;
      font: 500 3.2vh/1.3 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.04em; color: #ffffff; opacity: 0;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      transition: opacity 0.35s ease;
    }
    #voice-caption.show { opacity: 0.85; }

    /* ---- Toolbar ---------------------------------------------------------
       Always present, in both face and video mode. It exists because the wake
       word cannot be heard over the robot's own speaker at volume, so touch is
       the only reliable way to start a call while something is playing. */
    /* Floating, not a bar. No background and no reserved strip, so the face
       and any video keep the whole screen; only the controls themselves take
       pixels. pointer-events:none lets every tap that misses a button fall
       through to what is underneath. */
    #toolbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 190px;
      display: flex; align-items: center; gap: 22px;
      padding: 0 26px; box-sizing: border-box;
      background: none; border: 0; pointer-events: none;
    }
    #toolbar button { pointer-events: auto; }
    #toolbar button {
      appearance: none; border: 1px solid rgba(255,255,255,0.22); border-radius: 10px;
      background: rgba(18,16,14,0.55); backdrop-filter: blur(6px); color: #f2ede6;
      min-width: 130px; height: 118px; padding: 0 26px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font: 600 34px/1 ui-sans-serif, system-ui, sans-serif;
      border-radius: 22px;
    }

    /* The wake button is a FAB: circular, centred, and raised so it breaks the
       top edge of the bar. It is the one control someone reaches for in a
       hurry — when the robot is playing something loud and shouting at it does
       not work — so it is findable without looking, unlike the media buttons
       beside it. Centred rather than left, because the screen is reachable
       from either side. */
    #toolbar button#tb-call {
      position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
      width: 156px; height: 156px; min-width: 0; padding: 0;
      border-radius: 50%; flex-direction: column; gap: 6px;
      background: #1f6f4a; border: 1px solid #2f9668; color: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    /* The word is the whole button now, so it carries the size. */
    #tb-call-label { font: 700 40px/1 ui-sans-serif, system-ui, sans-serif;
                     letter-spacing: 0.01em; }
    #toolbar button#tb-call:active { background: #2a8d5f; border-color: #46c08c; }
    /* In a call the same button ends it — red, so the two are never confused. */
    #toolbar button#tb-call.in-call { background: #7a2020; border-color: #a83c3c; }
    #toolbar button#tb-call.in-call:active { background: #9a2b2b; border-color: #c65656; }
    /* The kiosk sets -webkit-tap-highlight-color: transparent globally, so a
       touch produces NO feedback at all unless it is put back by hand. Without
       this the toolbar feels broken even when it works. */
    #toolbar button:active { background: rgba(90,82,70,0.75); border-color: rgba(255,255,255,0.45); }
    /* `display: inline-flex` above is an author rule and so beats the UA
       stylesheet's `[hidden] { display: none }`. Without this the media
       buttons stay on screen with nothing playing. */
    #toolbar button[hidden] { display: none; }
    #toolbar button svg { width: 54px; height: 54px; fill: currentColor; }
    #tb-spacer { flex: 1; }
  </style>
</head>
<body>
  <div id="face">
    <robot-face
      color="{{ state.color or '#FFAE1E' }}"
      emotion="{{ state.mood or 'auto' }}"
      speed="1"></robot-face>
  </div>

  <div id="toolbar">
    <button id="tb-call" type="button" aria-label="Start a call">
      <span id="tb-call-label">Wake!</span>
    </button>
    <button id="tb-playpause" type="button" aria-label="Pause or resume" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="tb-icon-path" d="M8 5h3v14H8zm5 0h3v14h-3z"/></svg>
    </button>
    <button id="tb-stop" type="button" aria-label="Stop playback" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
    </button>
    <span id="tb-spacer"></span>
  </div>

  <div id="voice-caption"></div>
  <!-- Agent audio elements are appended here. A detached <audio> does not
       autoplay in Firefox, which is what the kiosk runs. Must live OUTSIDE the
       renderer branch — it is needed by both. -->
  <div id="voice-audio" hidden></div>

  {% if renderer == '2d' %}
  <script src="{{ url_for('static', filename='robot-face.js') }}"></script>
  {% else %}
  <script src="{{ url_for('static', filename='robot-face-gl.js') }}"></script>
  {% endif %}
  <script src="{{ url_for('static', filename='livekit-client.umd.min.js') }}"></script>
  <script>
    // Breadcrumbs to the server. A kiosk has no console, so anything that goes
    // wrong here is otherwise invisible.
    // Breadcrumbs to the server, and the three guards that keep them from
    // becoming a denial of service against it.
    //
    // This took the robot down twice. fetch() rejects ASYNCHRONOUSLY, so the
    // try/catch that used to wrap it caught nothing: a failed log became an
    // unhandled rejection, onunhandledrejection called jslog, and that fetched
    // again. Every failure manufactured another failure. The moment the server
    // slowed, this page attacked it — connections piling into CLOSE-WAIT until
    // it ran out of file descriptors at 1024 and stopped accepting entirely.
    //
    //   .catch      a failed log can never become an unhandled rejection
    //   busy        a log raised while logging cannot re-enter
    //   failures    after a few consecutive failures, stop until one succeeds,
    //               so an unreachable server is never hammered by its own
    //               error reports
    let jslogBusy = false;
    let jslogFailures = 0;
    function jslog(msg) {
      if (jslogBusy || jslogFailures >= 3) return;
      jslogBusy = true;
      try {
        fetch('/api/voice/log', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ msg: String(msg).slice(0, 400) }),
        }).then(() => { jslogFailures = 0; })
          .catch(() => { jslogFailures += 1; });
      } catch {
        jslogFailures += 1;
      } finally {
        jslogBusy = false;
      }
    }
    window.onerror = (m, src, line, col) => jslog(`JS ERROR ${m} @${line}:${col}`);
    window.onunhandledrejection = (e) => jslog(`UNHANDLED ${e.reason && e.reason.message || e.reason}`);
    jslog(`page loaded; LivekitClient=${typeof LivekitClient}`);

    const face = document.querySelector('robot-face');
    jslog(`A: face=${face ? 'found' : 'NULL'}`);

    let lastVoice = 'idle';

    // Colours the face takes on during a voice session. `connecting` and
    // `error` are the two that must be legible from across the room — they are
    // the states where you would otherwise be staring at a face wondering what
    // happened. The rest are ambient feedback.
    const VOICE_LOOK = {
      idle:       null,                                  // fall back to normal state
      connecting: { color: '#FFAE1E', emotion: 'thinking',  pulse: true,  caption: 'connecting…' },
      listening:  { color: '#2AD4FF', emotion: 'curious',   pulse: false, caption: 'listening' },
      thinking:   { color: '#FFD34D', emotion: 'thinking',  pulse: true,  caption: 'thinking…' },
      speaking:   { color: '#37D67A', emotion: 'happy',     pulse: false, caption: '' },
      error:      { color: '#FF3B30', emotion: 'sad',       pulse: false, caption: "couldn't connect" },
    };

    jslog('B: before caption lookup');
    const caption = document.getElementById('voice-caption');
    if (!caption) jslog('MISSING #voice-caption — captions will not render');

    function setCaption(text) {
      caption.textContent = text || '';
      caption.classList.toggle('show', !!text);
    }

    function apply(state) {
      if (!state) return;

      const v = state.voice || 'idle';
      const look = VOICE_LOOK[v];

      if (look) {
        face.setAttribute('color', look.color);
        face.setAttribute('emotion', look.emotion);
        document.body.classList.toggle('pulse', !!look.pulse);
        setCaption(look.caption);
      } else {
        document.body.classList.remove('pulse');
        setCaption('');
        if (state.mood)  face.setAttribute('emotion', state.mood);
        if (state.color) face.setAttribute('color', state.color);
      }

      if (v !== lastVoice) {
        jslog(`voice ${lastVoice} -> ${v}`);
        lastVoice = v;
        if (v === 'connecting') joinVoice();
        if (v === 'idle') leaveVoice();
        try { paintCall(); } catch (e) { jslog(`paintCall: ${(e && e.message) || e}`); }
      }
    }

    // ---- Voice session -------------------------------------------------
    // The client lives in the browser, joining with the robot's default
    // microphone and speaker: both are the XVF3800 array, which does echo
    // cancellation in hardware.
    jslog('C: before voice session section');
    let room = null;
    const audioSink = document.getElementById('voice-audio');

    async function report(voiceState, detail) {
      try {
        await fetch('/api/voice/state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voice: voiceState, detail: detail || '' }),
        });
      } catch (e) { console.warn('voice state report failed:', e); }
    }

    // Re-entrancy guard. `room` is only assigned AFTER the token fetch, so the
    // `if (room)` check below cannot stop a second call that arrives while the
    // first is still awaiting — and two of them share this one `room`, so the
    // later overwrites the earlier and both fail in confusing ways ("room is
    // null", then a 15s connect timeout from the abandoned attempt).
    //
    // Two callers can now race: the wake word (server sets `connecting`, SSE
    // wakes apply(), apply calls this) and the Wake button (calls this
    // directly, which POSTs /api/voice/wake, which sets `connecting`, which
    // comes back over SSE and calls this AGAIN).
    let joining = false;

    async function joinVoice() {
      jslog(`joinVoice called; room=${room ? 'present' : 'null'} joining=${joining}`);
      if (joining) { jslog('join already in flight; ignoring'); return; }
      if (room) {
        // Already in a session. Something re-set the state to `connecting`;
        // correct it rather than returning and leaving the face frozen there.
        jslog('already connected — re-reporting listening');
        report('listening');
        return;
      }
      joining = true;
      try {
        const res = await fetch('/api/voice/wake', { method: 'POST' });
        const { url, token } = await res.json();

        room = new LivekitClient.Room({
          adaptiveStream: true,
          // All OFF, deliberately. The XVF3800 already does echo
          // cancellation, noise suppression and gain control in hardware
          // before the browser sees the audio. Browser processing on top would
          // be a second canceller in series working from an already-altered
          // signal, and both degrade.
          audioCaptureDefaults: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
          },
        });

        room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
          if (track.kind !== 'audio') return;
          // attach() returns a DETACHED <audio>. It must be in the document or
          // Firefox will not autoplay it, and the robot is silent while looking
          // perfectly connected.
          const el = track.attach();
          el.autoplay = true;
          audioSink.appendChild(el);
        });
        room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
          track.detach().forEach(el => el.remove());
        });

        // The agent publishes its own state as a participant attribute
        // (lk.agent.state: initializing | idle | listening | thinking |
        // speaking). Using that is exact — inferring from who is making noise
        // cannot tell "thinking" from "waiting", which is the one distinction
        // worth showing.
        room.on(LivekitClient.RoomEvent.ParticipantAttributesChanged, (changed) => {
          const s = changed['lk.agent.state'];
          if (!s) return;

          // The microphone is never muted mid-call: muting the track churned
          // the audio path and silently killed the call after a few turns.
          if (s === 'speaking')       report('speaking');
          else if (s === 'thinking')  report('thinking');
          else if (s === 'listening' || s === 'idle') report('listening');
        });
        room.on(LivekitClient.RoomEvent.Disconnected, () => {
          room = null;
          report('idle');
        });

        const limit = (p, ms, what) => Promise.race([
          p,
          new Promise((_, rej) => setTimeout(() => rej(new Error(what + ' timed out after ' + ms + 'ms')), ms)),
        ]);

        jslog(`connecting to ${url}`);
        await limit(room.connect(url, token), 15000, 'room.connect');
        jslog('connected; enabling mic');
        await limit(room.localParticipant.setMicrophoneEnabled(true), 10000, 'microphone');
        jslog('mic enabled');
        report('listening');
      } catch (e) {
        if (room) { try { await room.disconnect(); } catch {} }
        room = null;
        jslog(`joinVoice FAILED: ${(e && e.message) || e}`);
        report('error', String((e && e.message) || e));
        // Only clear to idle if nothing has started since. Without this check a
        // stale timer from a failed attempt lands during the NEXT session and
        // drags a live call back to idle, which makes apply() call leaveVoice()
        // and null `room` mid-connect.
        setTimeout(() => { if (!room && !joining) report('idle'); }, 5000);
      } finally {
        joining = false;
      }
    }

    async function leaveVoice() {
      if (!room) return;
      try { await room.disconnect(); } catch {}
      room = null;
      audioSink.replaceChildren();
    }

    // Live updates via Server-Sent Events, with automatic reconnect if the
    // backend restarts or the network blips.
    jslog('D: before SSE section');
    let es;
    function connect() {
      es = new EventSource('/api/events');
      es.onmessage = (ev) => {
        try { apply(JSON.parse(ev.data)); }
        catch (e) { jslog(`apply() threw: ${(e && e.message) || e}`); }
      };
      es.onerror = () => { es.close(); setTimeout(connect, 2000); };
    }
    jslog('E: calling connect()');
    connect();
    jslog('F: connect() returned');

    // Belt-and-suspenders: if the stream is ever silent, poll occasionally.
    setInterval(async () => {
      try { apply(await (await fetch('/api/state', { cache: 'no-store' })).json()); }
      catch (e) { jslog(`poll apply() threw: ${(e && e.message) || e}`); }
    }, 30000);

    // ---- Toolbar -------------------------------------------------------
    // Touch is the only reliable way to start a call while something is
    // playing: at volume the robot's own speaker masks the wake word at the
    // microphone, so shouting does not work (log 025).
    jslog('G: wiring toolbar');
    const tbCall  = document.getElementById('tb-call');
    const tbLabel = document.getElementById('tb-call-label');
    const tbPP    = document.getElementById('tb-playpause');
    const tbStop  = document.getElementById('tb-stop');
    const tbIconPath  = document.getElementById('tb-icon-path');
    // One icon, two shapes. Two overlaid <svg>s toggled with `hidden` did not
    // work: `hidden` on an inline-SVG child does not hide it the way it does on
    // an HTML element, so both shapes drew at once.
    const ICON_PAUSE = 'M8 5h3v14H8zm5 0h3v14h-3z';
    const ICON_PLAY  = 'M8 5l11 7-11 7z';

    // Every handler swallows its own failure. A toolbar that throws must not
    // become a source of unhandled rejections — that is what took the robot
    // down twice (log 021).
    async function post(path) {
      try { await fetch(path, { method: 'POST', cache: 'no-store' }); }
      catch (e) { jslog(`toolbar ${path} failed: ${(e && e.message) || e}`); }
    }

    // Nothing here touches the video. The server already yields it to a call and
    // replays it afterwards — _video_yield_to_call / _video_resume_after_call in
    // app.py, on every voice state change, whoever caused it. It STOPS rather
    // than pauses, deliberately: a paused mpv leaves its window on screen with a
    // frozen frame over the face. An earlier version of this handler paused the
    // video here as well and the two mechanisms fought each other.
    tbCall.addEventListener('click', () => {
      jslog(`toolbar tapped; lastVoice=${lastVoice}`);
      if (lastVoice === 'idle') {
        jslog('toolbar: call');
        joinVoice();                 // POSTs /api/voice/wake and joins
      } else {
        jslog('toolbar: end call');
        report('idle');              // server broadcasts; apply() leaves
        leaveVoice();                // and directly, in case SSE is down
      }
    });

    tbPP.addEventListener('click', () => post(videoPaused ? '/api/video/resume'
                                                         : '/api/video/pause'));
    tbStop.addEventListener('click', () => post('/api/video/stop'));

    // Call becomes End for the duration of a session. Driven from the same
    // `lastVoice` the face uses, so the two can never disagree.
    let shownVoice = null;
    function paintCall() {
      // apply() can fire from SSE before this section has run, and `tbCall` is
      // a const in its temporal dead zone until then. Bail rather than throw:
      // the 2s poll repaints immediately afterwards.
      if (typeof tbCall === 'undefined' || !tbCall) return;
      if (lastVoice === shownVoice) return;
      shownVoice = lastVoice;
      const busy = lastVoice !== 'idle';
      tbLabel.textContent = busy ? 'End' : 'Wake!';
      tbCall.classList.toggle('in-call', busy);
      tbCall.setAttribute('aria-label', busy ? 'End the call' : 'Start a call');
    }

    // Video liveness is in neither /api/state nor the SSE stream, so it needs
    // its own poll. 2s: fast enough that a tap on pause looks instant, slow
    // enough to be nothing next to the video already playing.
    let videoPaused = false;
    async function pollVideo() {
      let st = null;
      try {
        st = await (await fetch('/api/video/status', { cache: 'no-store' })).json();
      } catch { /* player or Flask momentarily away; leave the toolbar as-is */ }
      if (st) {
        const playing = !!st.playing;
        videoPaused = !!st.paused;
        tbPP.hidden = !playing;
        tbStop.hidden = !playing;
        tbIconPath.setAttribute('d', videoPaused ? ICON_PLAY : ICON_PAUSE);
      }
      paintCall();
    }
    setInterval(pollVideo, 2000);
    pollVideo();
    jslog(`H: toolbar wired; call=${!!tbCall} pp=${!!tbPP} stop=${!!tbStop}`);
  </script>
</body>
</html>
