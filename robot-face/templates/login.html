<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Robot · Sign in</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, #16203a 0%, #0b1020 55%, #070a14 100%);
      color: #e8ecf6;
    }
    .card {
      width: min(92vw, 360px); padding: 32px 28px 28px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .robot { font-size: 44px; text-align: center; margin-bottom: 8px; }
    h1 { font-size: 19px; font-weight: 600; text-align: center; margin: 0 0 24px; letter-spacing: .2px; }
    label { display: block; font-size: 12px; color: #93a0bd; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .8px; }
    input[type=password] {
      width: 100%; padding: 13px 14px; font-size: 16px; color: #fff;
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input[type=password]:focus { border-color: #5b8cff; box-shadow: 0 0 0 3px rgba(91,140,255,0.25); }
    button {
      width: 100%; margin-top: 18px; padding: 13px; font-size: 15px; font-weight: 600;
      color: #fff; background: linear-gradient(180deg, #4f7dff, #3b63e8);
      border: 0; border-radius: 12px; cursor: pointer; transition: filter .15s, transform .05s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }
    .error { margin: 16px 0 0; padding: 10px 12px; font-size: 13px; text-align: center;
      color: #ffb4b4; background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.25); border-radius: 10px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('login') }}">
    <div class="robot">🤖</div>
    <h1>Robot Control</h1>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
